<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Quên mật khẩu</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../../assets/styles.css"></head><body>
<div class="container py-4"><a href="../../index.html" class="btn btn-link">← Về trang chủ</a>
<div class="card feature-card shadow-sm"><div class="card-body p-4"><h1 class="h3">Quên mật khẩu</h1><p class="text-secondary">Yêu cầu đặt lại mật khẩu qua email đã đăng ký.</p>
<form data-storage-key="cms_forgot-password" class="row g-3">
            <div class="col-md-6"><label class="form-label">Email đã đăng ký</label><input type="email" name="email" class="form-control" required></div>
            <div class="col-md-6"><label class="form-label">Câu hỏi bảo mật</label><input type="text" name="security" class="form-control"></div>
        
<div class="col-12"><label class="form-label">Ghi chú</label><textarea name="note" class="form-control" rows="4"></textarea></div>
<div class="col-12 d-flex gap-2"><button class="btn btn-primary" data-action="save">Lưu vào localStorage</button><button class="btn btn-outline-danger" data-action="clear">Xóa dữ liệu</button></div>
</form><p class="small text-muted mt-3">Dữ liệu trang này tự động sao lưu localStorage.</p></div></div></div>
<script src="../../assets/app.js"></script></body></html>
