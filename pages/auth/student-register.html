<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Đăng ký tài khoản sinh viên (xác nhận quốc gia)</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../../assets/styles.css"></head><body>
<div class="container py-4"><a href="../../index.html" class="btn btn-link">← Về trang chủ</a>
<div class="card feature-card shadow-sm"><div class="card-body p-4"><h1 class="h3">Đăng ký tài khoản sinh viên (xác nhận quốc gia)</h1><p class="text-secondary">Tạo tài khoản sinh viên và xác nhận quốc gia cư trú.</p>
<form data-storage-key="cms_student-register" class="row g-3">
            <div class="col-md-6"><label class="form-label">Họ và tên</label><input type="text" name="fullname" class="form-control" required></div>
            <div class="col-md-6"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required></div>
            <div class="col-md-6"><label class="form-label">Mật khẩu</label><input type="password" name="password" class="form-control" required></div>
            <div class="col-md-6"><label class="form-label">Vai trò</label><input type="text" class="form-control" value="Sinh viên" readonly></div>
            <div class="col-md-6"><label class="form-label">Quốc gia</label><select name="country" class="form-select" required><option value="">-- Chọn quốc gia --</option><option>Việt Nam</option><option>Singapore</option><option>Nhật Bản</option><option>Hàn Quốc</option><option>Hoa Kỳ</option></select></div>
            <div class="col-md-6 d-flex align-items-end"><div class="form-check"><input class="form-check-input" type="checkbox" name="countryConfirmed" id="c-student-register"><label class="form-check-label" for="c-student-register">Tôi xác nhận quốc gia cư trú hợp lệ</label></div></div>
        
<div class="col-12"><label class="form-label">Ghi chú</label><textarea name="note" class="form-control" rows="4"></textarea></div>
<div class="col-12 d-flex gap-2"><button class="btn btn-primary" data-action="save">Lưu vào localStorage</button><button class="btn btn-outline-danger" data-action="clear">Xóa dữ liệu</button></div>
</form><p class="small text-muted mt-3">Dữ liệu trang này tự động sao lưu localStorage.</p></div></div></div>
<script src="../../assets/app.js"></script></body></html>
